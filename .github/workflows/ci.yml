name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: ruff check src api tests

      # The corpus, Chroma index and embedding model are not in the repo, so CI runs the
      # offline suite: fake embedder, temp Chroma, mocked Claude client. The label-resolution
      # tests skip themselves when the chunk files are absent.
      - name: Run tests
        run: pytest -v
